name: Pipeline CI/CD Dashboard

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ETAPA 1: Integração Contínua (CI)
  ci-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Automatizados (CI)
        run: |
          pytest src/test_processador.py

      - name: Processar CSV e Gerar dados.json (Build)
        run: |
          python src/processador.py

      - name: Preparar Artefato Web para Publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

  # ETAPA 2: Entrega Contínua (CD)
  cd-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci-test-and-build

    steps:
      - name: Deploy Automático no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4